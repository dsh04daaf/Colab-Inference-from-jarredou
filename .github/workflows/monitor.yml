name: Monitor sources
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_sources.py
      - name: Open an issue when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s report.md ]; then
            gh issue create --title "Source monitor: $(date -u +%F)" --body-file report.md
          fi
      - name: Save the snapshot of tracked accounts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources_state.json
          git diff --cached --quiet || (git commit -q -m "Update sources snapshot" && git push -q)
